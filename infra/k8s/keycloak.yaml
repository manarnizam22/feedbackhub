apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: feedbackhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7
          args: ['start-dev', '--import-realm']
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: POSTGRES_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: 'true'
            # the browser reaches Keycloak on the kind port mapping; pinning the
            # hostname makes issued tokens carry exactly that issuer, which the
            # API validates (ADR/verify-token: issuer vs internal JWKS split)
            - name: KC_HOSTNAME
              value: http://localhost:30082
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: feedbackhub-secrets
                  key: GOOGLE_CLIENT_SECRET
          ports:
            - containerPort: 8080
            - containerPort: 9000
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
            - name: theme-root
              mountPath: /opt/keycloak/themes/feedbackhub/login
            - name: theme-css
              mountPath: /opt/keycloak/themes/feedbackhub/login/resources/css
            - name: theme-messages
              mountPath: /opt/keycloak/themes/feedbackhub/login/messages
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: theme-root
          configMap:
            name: keycloak-theme-root
        - name: theme-css
          configMap:
            name: keycloak-theme-css
        - name: theme-messages
          configMap:
            name: keycloak-theme-messages
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: feedbackhub
spec:
  selector:
    app: keycloak
  type: NodePort
  ports:
    - port: 8080
      nodePort: 30082
