apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: feedbackhub
spec:
  # replicas: 1 is deliberate — SSE fan-out is in-process (ADR-0010);
  # scaling out requires the documented Redis pub/sub step first.
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: feedbackhub-api:dev
          imagePullPolicy: Never
          env:
            - name: PORT
              value: '3010'
            - name: CORS_ORIGIN
              value: http://localhost:30080
            - name: KEYCLOAK_ISSUER
              value: http://localhost:30082/realms/feedbackhub
            - name: KEYCLOAK_INTERNAL_URL
              value: http://keycloak:8080/realms/feedbackhub
            - name: API_AUDIENCE
              value: feedbackhub-api
            - name: DATABASE_URL
              value: postgres://feedbackhub:feedbackhub-dev@postgres:5432/feedbackhub
          ports:
            - containerPort: 3010
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: feedbackhub
spec:
  selector:
    app: api
  type: NodePort
  ports:
    - port: 3010
      nodePort: 30081
