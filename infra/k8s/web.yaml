apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: feedbackhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: feedbackhub-web:dev
          imagePullPolicy: Never
          env:
            - name: WEB_API_URL
              value: http://localhost:30081
            - name: WEB_KEYCLOAK_URL
              value: http://localhost:30082
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: feedbackhub
spec:
  selector:
    app: web
  type: NodePort
  ports:
    - port: 80
      nodePort: 30080
