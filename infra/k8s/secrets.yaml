# Dev-grade values so `kubectl apply -k` works out of the box on kind.
# In any real environment these come from a secret manager, not this file.
apiVersion: v1
kind: Secret
metadata:
  name: feedbackhub-secrets
  namespace: feedbackhub
type: Opaque
stringData:
  POSTGRES_USER: feedbackhub
  POSTGRES_PASSWORD: feedbackhub-dev
  POSTGRES_DB: feedbackhub
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
  GOOGLE_CLIENT_ID: replace-me.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: replace-me
  DATABASE_URL: postgres://feedbackhub:feedbackhub-dev@postgres:5432/feedbackhub
