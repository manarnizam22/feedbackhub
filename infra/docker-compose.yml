name: feedbackhub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedbackhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedbackhub-dev}
      POSTGRES_DB: ${POSTGRES_DB:-feedbackhub}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-feedbackhub}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-feedbackhub-dev}
      KC_HEALTH_ENABLED: 'true'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-me.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-me}
    ports:
      - '8080:8080'
      - '9000:9000'
    volumes:
      - ./keycloak/realm-feedbackhub.json:/opt/keycloak/data/import/realm-feedbackhub.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # the Keycloak image ships no curl/wget; probe the management port over bash's /dev/tcp
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  postgres-data:
