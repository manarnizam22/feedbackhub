@if (loading()) {
  <fh-spinner label="Loading request…" />
} @else {
  <div class="mx-auto max-w-xl">
    <a
      [routerLink]="isEdit ? ['/requests', editId] : ['/requests']"
      class="text-sm text-zinc-500 hover:text-indigo-600 dark:hover:text-indigo-400"
      >← Back</a
    >
    <h1 class="mt-3 text-xl font-semibold tracking-tight">
      {{ isEdit ? 'Edit request' : 'New request' }}
    </h1>

    @if (banner()) {
      <div
        role="alert"
        class="mt-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-300"
      >
        {{ banner() }}
      </div>
    }

    <form class="mt-5 flex flex-col gap-5" (submit)="$event.preventDefault(); submit()">
      <fh-form-field
        label="Title"
        inputId="title"
        [error]="fieldErrors()['title'] ?? null"
        [required]="true"
      >
        <input
          id="title"
          type="text"
          class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-indigo-500 dark:border-zinc-700 dark:bg-zinc-950"
          [value]="title()"
          (input)="title.set($any($event.target).value)"
          [attr.aria-describedby]="fieldErrors()['title'] ? 'title-error' : null"
          [attr.aria-invalid]="!!fieldErrors()['title']"
        />
      </fh-form-field>

      <fh-form-field
        label="Description"
        inputId="description"
        [error]="fieldErrors()['description'] ?? null"
        [required]="true"
      >
        <textarea
          id="description"
          rows="7"
          class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-indigo-500 dark:border-zinc-700 dark:bg-zinc-950"
          [value]="description()"
          (input)="description.set($any($event.target).value)"
          [attr.aria-describedby]="fieldErrors()['description'] ? 'description-error' : null"
          [attr.aria-invalid]="!!fieldErrors()['description']"
        ></textarea>
        <p class="text-xs text-zinc-500">{{ descriptionCount() }} / 10000</p>
      </fh-form-field>

      <fh-form-field
        label="Category"
        inputId="categoryId"
        [error]="fieldErrors()['categoryId'] ?? null"
        [required]="true"
      >
        <select
          id="categoryId"
          class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-indigo-500 dark:border-zinc-700 dark:bg-zinc-950"
          [value]="categoryId()"
          (change)="categoryId.set($any($event.target).value)"
          [attr.aria-describedby]="fieldErrors()['categoryId'] ? 'categoryId-error' : null"
        >
          <option value="" disabled>Choose a category…</option>
          @for (category of bootstrap.activeCategories(); track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
      </fh-form-field>

      <div class="flex gap-3">
        <button fh-button type="submit" [disabled]="saving()">
          {{ saving() ? 'Saving…' : isEdit ? 'Save changes' : 'Submit request' }}
        </button>
        <a fh-button variant="ghost" [routerLink]="isEdit ? ['/requests', editId] : ['/requests']"
          >Cancel</a
        >
      </div>
    </form>
  </div>
}
